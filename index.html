<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>세전 월급 계산기 (역산기)</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.1);
      --glass-border: 1px solid rgba(255,255,255,0.15);
      --glow: 0 0 20px rgba(59, 130, 246, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg-color);
      background-image: 
        radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.15) 0px, transparent 50%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .container {
      width: 100%;
      max-width: 500px;
      position: relative;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 2rem;
      text-align: center;
      background: linear-gradient(to right, #60a5fa, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.025em;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: var(--glass-border);
      border-radius: 1.5rem;
      padding: 2.5rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    input, select {
      width: 100%;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 0.875rem 1rem;
      border-radius: 0.75rem;
      font-size: 1rem;
      transition: all 0.2s ease;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }

    .btn {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 1rem;
      border-radius: 0.75rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-top: 1rem;
      box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.4);
    }

    .btn:hover {
      background: var(--primary-hover);
      box-shadow: var(--glow);
      transform: translateY(-2px);
    }

    .btn:active {
      transform: translateY(0);
    }

    /* Result Section */
    #result-section {
      margin-top: 2rem;
      display: none;
      animation: slideUp 0.4s ease-out forwards;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .result-box {
      background: rgba(59, 130, 246, 0.1);
      border: 1px solid rgba(59, 130, 246, 0.2);
      border-radius: 1rem;
      padding: 1.5rem;
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .result-title {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    .result-value {
      font-size: 2.25rem;
      font-weight: 700;
      color: #60a5fa;
    }

    .breakdown {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      font-size: 0.9rem;
    }

    .breakdown-item {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 0.5rem;
    }
    
    .breakdown-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
      font-weight: 600;
      color: #fb7185;
      margin-top: 0.5rem;
    }

    .error-msg {
      color: #fb7185;
      font-size: 0.875rem;
      margin-top: 0.5rem;
      display: none;
    }

    /* Formatting helper */
    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-wrapper input {
      padding-right: 2.5rem;
    }
    .unit {
      position: absolute;
      right: 1rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>세전 월급 역산기</h1>
    <div class="card">
      <div class="form-group">
        <label for="target-net">세후 받을 월급</label>
        <div class="input-wrapper">
          <input type="text" id="target-net" placeholder="예: 3,000,000" oninput="formatNumber(this)">
          <span class="unit">원</span>
        </div>
      </div>

      <div class="form-group">
        <label for="emp-type">근로자 유형</label>
        <select id="emp-type">
          <option value="employee" selected>직원</option>
          <option value="ceo">대표자 (고용보험 면제)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="dependents">공제대상가족수 (본인 포함)</label>
        <select id="dependents">
          <option value="1" selected>1명 (본인)</option>
          <option value="2">2명</option>
          <option value="3">3명</option>
          <option value="4">4명</option>
          <option value="5">5명</option>
          <option value="6">6명</option>
          <option value="7">7명</option>
          <option value="8">8명</option>
          <option value="9">9명</option>
          <option value="10">10명</option>
          <option value="11">11명 이상</option>
        </select>
      </div>

      <div class="form-group">
        <label for="pension-amt">국민연금 금액 (선택)</label>
        <div class="input-wrapper">
          <input type="text" id="pension-amt" placeholder="입력 시 해당 금액 적용" oninput="formatNumber(this)">
          <span class="unit">원</span>
        </div>
        <div id="pension-error" class="error-msg"></div>
      </div>

      <div class="form-group">
        <label for="nontaxable-amt">비과세 금액 (선택)</label>
        <div class="input-wrapper">
          <input type="text" id="nontaxable-amt" placeholder="예: 200,000" oninput="formatNumber(this)">
          <span class="unit">원</span>
        </div>
      </div>

      <button class="btn" onclick="calculate()">계산하기</button>

      <div id="result-section">
        <div class="result-box">
          <div class="result-title">필요한 세전 월급(비과세 제외)</div>
          <div class="result-value" id="res-gross">0원</div>
        </div>
        
        <div class="breakdown">
          <div class="breakdown-item">
            <span>국민연금</span>
            <span id="b-pension">0원</span>
          </div>
          <div class="breakdown-item">
            <span>건강보험</span>
            <span id="b-health">0원</span>
          </div>
          <div class="breakdown-item">
            <span>요양보험</span>
            <span id="b-care">0원</span>
          </div>
          <div class="breakdown-item">
            <span>고용보험</span>
            <span id="b-employ">0원</span>
          </div>
          <div class="breakdown-item">
            <span>소득세</span>
            <span id="b-tax">0원</span>
          </div>
          <div class="breakdown-item">
            <span>지방소득세</span>
            <span id="b-localtax">0원</span>
          </div>
          <div class="breakdown-item">
            <span>공제합계</span>
            <span id="b-total">0원</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="tax_table.js"></script>
  <script>
    // Constants for 2026
    const HEALTH_RATE = 0.03595;
    const CARE_RATE = 0.1314;
    const EMPLOY_RATE = 0.009;
    const PENSION_RATE = 0.0475;

    const TAX_10M = [1507400, 1431570, 1200840, 1170840, 1140840, 1110840, 1080840, 1050840, 1020840, 990840, 960840];

    // Enter 키 입력 시 다음 칸으로 이동
    document.addEventListener('DOMContentLoaded', () => {
      const focusableElements = Array.from(document.querySelectorAll('input, select, button.btn'));
      focusableElements.forEach((el, index) => {
        el.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            if (el.tagName.toLowerCase() === 'button') {
              el.click();
            } else {
              const nextEl = focusableElements[index + 1];
              if (nextEl) {
                nextEl.focus();
              }
            }
          }
        });
      });
    });

    function formatNumber(input) {
      let val = input.value.replace(/[^\d]/g, '');
      if (val) {
        input.value = parseInt(val, 10).toLocaleString('ko-KR');
      } else {
        input.value = '';
      }
    }

    function getRawValue(id) {
      let val = document.getElementById(id).value.replace(/[^\d]/g, '');
      return val ? parseInt(val, 10) : null;
    }

    // 소득세 계산 함수
    function getIncomeTax(gross, dependents) {
      let depIdx = Math.min(dependents, 11) - 1;
      
      if (gross <= 10000000) {
        // Find in TAX_BRACKETS
        let bracket = TAX_BRACKETS.find(b => gross >= b.min && gross < b.max);
        if (bracket) return bracket.taxes[depIdx];
        
        // Edge case: Exactly 10M won (handled above if upper bound is inclusive/exclusive)
        // Usually ranges are "이상 미만"
        if (gross === 10000000) return TAX_10M[depIdx];
        return 0;
      }

      // Over 10M logic
      let baseTax = TAX_10M[depIdx];
      let excess = 0;
      
      if (gross <= 14000000) {
        excess = gross - 10000000;
        return baseTax + Math.floor(excess * 0.98 * 0.35) + 25000;
      } else if (gross <= 28000000) {
        excess = gross - 14000000;
        return baseTax + 1397000 + Math.floor(excess * 0.98 * 0.38);
      } else if (gross <= 30000000) {
        excess = gross - 28000000;
        return baseTax + 6610600 + Math.floor(excess * 0.98 * 0.40);
      } else if (gross <= 45000000) {
        excess = gross - 30000000;
        return baseTax + 7394600 + Math.floor(excess * 0.40);
      } else if (gross <= 87000000) {
        excess = gross - 45000000;
        return baseTax + 13394600 + Math.floor(excess * 0.42);
      } else {
        excess = gross - 87000000;
        return baseTax + 31034600 + Math.floor(excess * 0.45);
      }
    }

    function calculateDeductions(gross, dependents, fixedPension, nonTaxable, isCEO) {
      // 1. 원단위 절사 (floor down to 10s)
      let truncate10 = val => Math.floor(val / 10) * 10;

      let taxable = Math.max(0, gross - nonTaxable);

      let pension = fixedPension !== null ? fixedPension : truncate10(taxable * PENSION_RATE);
      let health = truncate10(taxable * HEALTH_RATE);
      let care = truncate10(health * CARE_RATE);
      let employ = isCEO ? 0 : truncate10(taxable * EMPLOY_RATE);
      
      let tax = getIncomeTax(taxable, dependents);
      // 소득세 원단위 절사 (보통 표에 이미 되어있으나 혹시나 해서)
      tax = truncate10(tax);
      let localTax = truncate10(tax * 0.1);

      let totalDeduct = pension + health + care + employ + tax + localTax;
      let net = gross - totalDeduct;

      return {
        gross, taxable, nonTaxable, pension, health, care, employ, tax, localTax, totalDeduct, net
      };
    }

    function calculate() {
      let targetNet = getRawValue('target-net');
      if (!targetNet) {
        alert("세후 받을 월급을 입력해주세요.");
        return;
      }
      let dependents = parseInt(document.getElementById('dependents').value, 10);
      let fixedPension = getRawValue('pension-amt');
      let nonTaxable = getRawValue('nontaxable-amt') || 0;
      let isCEO = document.getElementById('emp-type').value === 'ceo';

      // Binary Search
      let low = targetNet;
      let high = targetNet * 3; // safe upper bound
      let bestMatch = null;
      
      while (low <= high) {
        let mid = Math.floor((low + high) / 2);
        let res = calculateDeductions(mid, dependents, fixedPension, nonTaxable, isCEO);
        
        if (res.net === targetNet) {
          bestMatch = res;
          // To find the *minimum* gross that gives this net, we could go lower,
          // but since tax tables can cause slight plateaus, let's just step down by 10
          high = mid - 1; 
        } else if (res.net < targetNet) {
          low = mid + 1;
        } else {
          high = mid - 1;
        }
      }

      // if exact match not found (rare, but possible due to truncation steps missing a single won value),
      // pick the closest one that guarantees AT LEAST the target net
      if (!bestMatch) {
        // Let's recalculate with 'low' which will be >= targetNet
        bestMatch = calculateDeductions(low, dependents, fixedPension, nonTaxable, isCEO);
      }

      displayResult(bestMatch);
    }

    function displayResult(res) {
      document.getElementById('result-section').style.display = 'block';
      
      const f = v => v.toLocaleString('ko-KR') + '원';

      document.getElementById('res-gross').innerText = f(res.taxable);
      document.getElementById('b-pension').innerText = f(res.pension);
      document.getElementById('b-health').innerText = f(res.health);
      document.getElementById('b-care').innerText = f(res.care);
      document.getElementById('b-employ').innerText = f(res.employ);
      document.getElementById('b-tax').innerText = f(res.tax);
      document.getElementById('b-localtax').innerText = f(res.localTax);
      document.getElementById('b-total').innerText = f(res.totalDeduct);
    }
  </script>
</body>
</html>
